services:
  orchestrator:
    build:
      context: .
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./results:/app/results
    environment:
      OBSERVABILITY_NETWORK: brokers_benchmark_observability
    expose:
      - "8000"
    ports:
      - "8080:8080"
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.12.0
    # Docker Desktop socket is owned by root. Prometheus needs read access to
    # it only for Docker service discovery of dynamic benchmark containers.
    user: "0:0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - prometheus-data:/prometheus
    networks:
      - observability

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --whitelisted_container_labels=namespace,scenario_id,component
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - observability

  grafana:
    image: grafana/grafana:12.4.0
    ports:
      - "3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - cadvisor
    networks:
      - observability

networks:
  observability:
    name: brokers_benchmark_observability

volumes:
  prometheus-data:
  grafana-data:
